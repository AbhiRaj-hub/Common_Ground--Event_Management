<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Common Ground Events</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <h1 class="logo">Common Ground Events</h1>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h2>Campus Fest 2026</h2>
            <p>Discover and register for upcoming technical, cultural, and literary events.</p>
        </section>

        <section class="controls">
            <input type="text" id="search-input" class="search-input" placeholder="Search events or venues...">
            <div id="category-filters" class="filter-group">
                <button class="filter-btn active" data-category="All">All</button>
                <button class="filter-btn" data-category="Technical">Technical</button>
                <button class="filter-btn" data-category="Cultural">Cultural</button>
                <button class="filter-btn" data-category="Literary">Literary</button>
                <button class="filter-btn" data-category="Business">Business</button>
                <button class="filter-btn" data-category="Creative">Creative</button>
            </div>
        </section>

        <section id="events-grid" class="events-grid"></section>
    </main>

    <script src="js/events.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
